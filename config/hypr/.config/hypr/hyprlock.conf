# $text_color = rgba(D7E5E6FF)
# $entry_background_color = rgba(09151611)
# $entry_border_color = rgba(82949555)
# $entry_color = rgba(B8CACBFF)
$text_color = rgba(FFFFFFFF)
$entry_background_color = rgba(33333360)
$entry_border_color = rgba(3B3B3B64)
$entry_color = rgba(FFFFFFFF)
$font_family = Noto Sans
$font_family_clock = Font Awesome 6 Free
$font_family_nerd = Symbols Nerd Font
$background = ~/Pictures/backgrounds/miku-space.jpg

animation {
    animation = fade, 0
}

background {
    # color = rgba(041011FF)
    # color = rgba(000000FF)
    # path = {{ SWWW_WALL }}
    path = $background
    # blur_size = 5
    # blur_passes = 4
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    # fade_on_empty = true

    position = 100, -80
    halign = left
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    shadow_passes = 1
    shadow_size = 15
    shadow_boost = 0.5
    color = $text_color
    font_size = 100
    font_family = $font_family_clock

    position = 100, 120
    halign = left
    valign = center
}
label { # Greeting
    monitor =
    text = Hi, $USER
    shadow_passes = 1
    shadow_size = 15
    shadow_boost = 0.5
    color = $text_color
    font_size = 24
    font_family = $font_family

    position = 100, 0
    halign = left
    valign = center
}
label { # lock icon
    monitor =
    text = 󰌾
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 21
    font_family = $font_family_nerd

    position = 100, 100
    halign = left
    valign = bottom
}
label { # "locked" text
    monitor =
    text = locked
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 140, 100
    halign = left
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 100, -100
    halign = left
    valign = top
}
