#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on   = "<C-g>"
run  = "shell --confirm --block lazygit"
desc = "Lazygit"

[[mgr.prepend_keymap]]
on   = [ "#", "a" ]
run  = "plugin yamb save"
desc = "Add bookmark"

[[mgr.prepend_keymap]]
on   = [ "#", "#" ]
run  = "plugin yamb jump_by_key"
desc = "Jump bookmark by key"

[[mgr.prepend_keymap]]
on   = [ "#", "r" ]
run  = "plugin yamb delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on   = [ "c", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "w" ]
run  = "rename --empty=all"
desc = "Rename from scratch"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = "cd /"
desc = "Go to the root directory"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Desktop"
desc = "Go to the desktop directory"

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "cd ~/Repositories"
desc = "Go to the Repositories directory"
