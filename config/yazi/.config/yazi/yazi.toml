[mgr]
ratio = [1, 3, 4]
linemode = "size"

[preview]
wrap = "yes"
image_filter = "lanczos3"

[opener]
play = [
  { run = "mpv --force-window %s", orphan = true, desc = "Play", for = "unix" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
