config_version = 20

[bar.default]
capsule = true
center = [ "audio_visualizer", "clock", "cat" ]
compositor_blur = false
end = [ "ram", "temp", "volume", "brightness", "battery", "recorder", "notes", "tray", "nightlight", "caffeine", "session" ]
margin_ends = 0
start = [ "launcher", "workspaces", "active_window", "media" ]
thickness = 40

[brightness]
enable_ddcutil = true

[hooks]
wallpaper_changed = "wallreel -a \"$NOCTALIA_WALLPAPER_PATH\""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 0.0

[location]
address = "Munich, Germany"

[lockscreen]
blurred_desktop = true
fingerprint = false
grace_period_seconds = 5

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1098.0
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 112.0
    box_width = 480.0
    cx = 1115.0
    cy = 1048.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_color = "surface_container"
        background_opacity = 0.88
        center_text = true
        clock_style = "digital"
        color = "on_surface"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 112.0
    box_width = 320.0
    cx = 1525.0
    cy = 1048.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        background_color = "surface_container"
        background_opacity = 0.88
        bands = 32
        color_1 = "on_surface"
        color_2 = "primary"
        mirrored = true
        show_wave = false
        show_when_idle = true

[nightlight]
enabled = true

[plugin_settings."noctalia/screen_recorder"]
directory = "~/Videos/recordings"
filename_pattern = "noctalia_recording_%Y%m%d_%H%M%S"
video_codec = "av1"
video_qp = 18

[plugins]
enabled = [ "noctalia/notes", "noctalia/screen_recorder", "noctalia/bongocat" ]

[shell]
font_family = "LXGW WenKai"
polkit_agent = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_launcher = true
    polkit_placement = "attached"
    polkit_position = "auto"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
custom_palette = "catppuccin-mocha-blue"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/home/kolkas/Pictures/backgrounds/reimu-wind.png"

    [wallpaper.last]
    path = "/home/kolkas/Pictures/backgrounds/reimu-wind.png"

    [wallpaper.monitors.DP-1]
    path = "/home/kolkas/Pictures/backgrounds/reimu-wind.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/kolkas/Pictures/backgrounds/reimu-wind.png"

[widget.active_window]
max_length = 320
min_length = 0
title_scroll = "on_hover"

    [widget.active_window.actions]
    left = "exec [ \"$XDG_CURRENT_DESKTOP\" = niri ] && niri msg action center-column"
    middle = "exec [ \"$XDG_CURRENT_DESKTOP\" = niri ] && niri msg action close-window"
    right = "exec [ \"$XDG_CURRENT_DESKTOP\" = niri ] && niri msg action maximize-window-to-edges"

[widget.audio_visualizer]
color_1 = "outline_variant"
show_wave = true
show_when_idle = true

[widget.caffeine]
color = "secondary"

[widget.cat]
capsule_padding = 20
input_devices = [ "/dev/input/by-id/usb-CHERRY_CHERRY_Keyboard-event-kbd" ]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:L%H:%M | %a %d. %b}"

[widget.media]
max_length = 320
min_length = 0
rotate_album_art = true
title_scroll = "on_hover"

[widget.network]
show_vpn_label = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
color = "error"

[widget.tray]
drawer = true
drawer_item_size = 18.0

[widget.workspaces]
empty_color = "surface_container"
occupied_color = "primary_container"